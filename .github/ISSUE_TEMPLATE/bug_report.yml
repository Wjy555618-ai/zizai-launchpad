name: Bug report
description: 报告可复现的功能、性能或可访问性问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除截图和日志中的个人路径或其他隐私数据。
  - type: input
    id: version
    attributes:
      label: 应用与 macOS 版本
      placeholder: "自在启动台 1.0.0 (1), macOS 26.0, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动应用开始，列出最小必要步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充证据
      description: 可附加已脱敏的截图、录屏或日志。

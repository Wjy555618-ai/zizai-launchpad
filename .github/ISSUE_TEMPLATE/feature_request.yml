name: Feature request
description: 提出一个有明确用户价值的改进建议
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 请先描述什么情境下的什么问题，而不是只给出功能名称。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式
  - type: checkboxes
    id: boundaries
    attributes:
      label: 隐私与产品边界
      options:
        - label: 该建议不要求上传应用列表或布局数据
          required: true

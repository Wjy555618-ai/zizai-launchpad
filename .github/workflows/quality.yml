name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, analyze
    # Release gates must run on a generally available image. The xcode-27
    # image is still a GitHub public preview and its virtual GPU can crash
    # AppKit/SwiftUI rendering before XCTest can report an assertion.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Pin the exact stable toolchain instead of inheriting the runner image's
      # moving default. Xcode 26.6 currently crashes in Swift IR generation for
      # this warning-free Universal 2 Release build before emitting a source
      # diagnostic; Xcode 26.5 remains installed on the GA macOS 26 image.
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Run release quality gate
        run: ./scripts/verify_release.sh

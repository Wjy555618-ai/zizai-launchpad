name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Xcode ${{ matrix.xcode }}
    # The Intel runner deliberately complements the physical Apple Silicon
    # development machine and exercises the other Universal 2 architecture.
    # Hosted jobs compile the UI suite but do not claim an interactive run.
    runs-on: macos-26-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.6"]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Verify both the supported stable floor and the current stable toolchain
      # instead of inheriting a moving runner default.
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      # GitHub-hosted macOS is an ephemeral, non-interactive validation host.
      # It runs every deterministic release gate and builds the complete UI
      # suite, but never converts a missing trusted Accessibility session into
      # a fake XCUITest pass. The default local gate remains the required real
      # UI execution path before release.
      - name: Run hosted quality gate
        run: ./scripts/verify_release.sh --hosted-ci

name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Xcode ${{ matrix.xcode }}
    # The Intel runner is a deliberate complement to the physical Apple
    # Silicon development machine: it exercises the other Universal 2
    # architecture and provides the complete virtual rendering stack needed
    # by AppKit/SwiftUI composition tests. The macOS 26 arm64 runner currently
    # terminates those tests inside RenderBox before XCTest can report results.
    runs-on: macos-26-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.6"]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Verify both the supported stable floor and the current stable toolchain
      # instead of inheriting a moving runner default.
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Run release quality gate
        run: ./scripts/verify_release.sh

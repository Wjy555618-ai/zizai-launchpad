name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.stage }} / Xcode ${{ matrix.xcode }}
    # Core stays on Intel to exercise the other Universal 2 architecture.
    # Runtime uses Apple Silicon because the current macOS 26 Intel image has
    # a confirmed IconServices crash loop that can hang every AppKit icon
    # request indefinitely: https://github.com/actions/runner-images/issues/14751
    # Routing the real runtime audit to an unaffected runner preserves the
    # rendering contract instead of disabling IconServices or raising timeouts.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "26.2"
            stage: core
            runner: macos-26-intel
          - xcode: "26.6"
            stage: core
            runner: macos-26-intel
          - xcode: "26.2"
            stage: runtime
            runner: macos-26
          - xcode: "26.6"
            stage: runtime
            runner: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Verify both the supported stable floor and the current stable toolchain
      # instead of inheriting a moving runner default.
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      # Core and runtime stages are independent responsibilities of the same
      # release contract. Running them in parallel keeps every deterministic
      # gate while avoiding one opaque, timeout-prone serial job. The core
      # stage compiles XCUITest but cannot claim execution without a trusted
      # interactive Accessibility session.
      - name: Run hosted ${{ matrix.stage }} gate
        run: ./scripts/verify_release.sh --hosted-ci-${{ matrix.stage }}

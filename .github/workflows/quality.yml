name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, analyze
    # Release gates must run on a generally available image. The xcode-27
    # image is still a GitHub public preview and its virtual GPU can crash
    # AppKit/SwiftUI rendering before XCTest can report an assertion.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Run release quality gate
        run: ./scripts/verify_release.sh

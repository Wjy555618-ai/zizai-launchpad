name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.stage }} / Xcode ${{ matrix.xcode }}
    # The Intel runner deliberately complements the physical Apple Silicon
    # development machine and exercises the other Universal 2 architecture.
    # Hosted jobs compile the UI suite but do not claim an interactive run.
    runs-on: macos-26-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ["26.2", "26.6"]
        stage: [core, runtime]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Verify both the supported stable floor and the current stable toolchain
      # instead of inheriting a moving runner default.
      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      # Core and runtime stages are independent responsibilities of the same
      # release contract. Running them in parallel keeps every deterministic
      # gate while avoiding one opaque, timeout-prone serial job. The core
      # stage compiles XCUITest but cannot claim execution without a trusted
      # interactive Accessibility session.
      - name: Run hosted ${{ matrix.stage }} gate
        run: ./scripts/verify_release.sh --hosted-ci-${{ matrix.stage }}
